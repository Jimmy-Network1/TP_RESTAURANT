{% extends "base.html" %}

{% block title %}Supprimer une catégorie{% endblock %}

{% block content %}
<h1>Supprimer une catégorie</h1>
<p>Confirmer la suppression de "{{ category.name }}" ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'menu:categories' %}">Annuler</a>
</form>
{% endblock %}
