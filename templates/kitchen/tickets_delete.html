{% extends "base.html" %}

{% block title %}Supprimer un ticket{% endblock %}

{% block content %}
<h1>Supprimer un ticket</h1>
<p>Confirmer la suppression du ticket #{{ ticket.id }} ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'kitchen:tickets' %}">Annuler</a>
</form>
{% endblock %}
