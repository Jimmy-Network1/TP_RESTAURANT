{% extends "base.html" %}

{% block title %}Supprimer une recette{% endblock %}

{% block content %}
<h1>Supprimer une recette</h1>
<p>Confirmer la suppression de la recette "{{ recipe.dish.name }}" ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'kitchen:recipes' %}">Annuler</a>
</form>
{% endblock %}
