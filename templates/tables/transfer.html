{% extends "base_staff.html" %}
{% block title %}Transférer / Fusionner — Saveur 237{% endblock %}
{% block content %}
<div data-animate="fadeUp" style="margin-bottom:18px;">
  <span class="pill" style="background:var(--green-light);color:var(--green);">🔄 Salle</span>
  <h2 style="font-family:'Playfair Display',serif;margin:8px 0 4px;">Transférer ou fusionner</h2>
  <p class="muted">Déplacez une commande vers une autre table, ou fusionnez deux tables.</p>
</div>

<form method="post" data-animate="fadeUp">{% csrf_token %}
  <div class="grid" style="gap:18px;">
    <label class="card" style="cursor:pointer;border:2px solid transparent;transition:.25s;flex:1;min-width:260px;" onclick="this.querySelector('input').checked=true;document.querySelectorAll('.action-card').forEach(c=>c.style.borderColor='transparent');this.style.borderColor='var(--green)';" class="action-card">
      <input type="radio" name="action" value="transfer" checked style="display:none;">
      <div style="text-align:center;padding:18px 0;">
        <div style="font-size:38px;">🔄</div>
        <h3 style="margin:10px 0 4px;">Transférer</h3>
        <p class="muted" style="font-size:13px;">Déplacer la commande vers une autre table</p>
      </div>
    </label>
    <label class="card" style="cursor:pointer;border:2px solid transparent;transition:.25s;flex:1;min-width:260px;" onclick="this.querySelector('input').checked=true;document.querySelectorAll('.action-card').forEach(c=>c.style.borderColor='transparent');this.style.borderColor='var(--green)';" class="action-card">
      <input type="radio" name="action" value="merge" style="display:none;">
      <div style="text-align:center;padding:18px 0;">
        <div style="font-size:38px;">🔗</div>
        <h3 style="margin:10px 0 4px;">Fusionner</h3>
        <p class="muted" style="font-size:13px;">Combiner deux tables en une seule</p>
      </div>
    </label>
  </div>

  <div class="card" style="margin-top:18px;">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;">
      <label style="display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:13px;font-weight:600;color:#555;">📌 Table source</span>
        <select name="source_table" style="padding:10px 12px;border:1px solid #ddd;border-radius:8px;">
          {% for t in tables %}
          <option value="{{ t.id }}" {% if t.id == source_table_id %}selected{% endif %}>{{ t.name }} ({{ t.zone|default:'-' }})</option>
          {% endfor %}
        </select>
      </label>
      <label style="display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:13px;font-weight:600;color:#555;">🎯 Table destination</span>
        <select name="destination_table" style="padding:10px 12px;border:1px solid #ddd;border-radius:8px;">
          {% for t in tables %}
          <option value="{{ t.id }}">{{ t.name }} ({{ t.zone|default:'-' }})</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div style="margin-top:18px;display:flex;gap:10px;">
      <button class="btn" type="submit">✅ Confirmer</button>
      <a class="btn-outline" href="{% url 'tables:plan' %}">Annuler</a>
    </div>
  </div>
</form>
{% endblock %}
