{% extends "base_staff.html" %}

{% block title %}Ajouter un article — Inventaire{% endblock %}

{% block content %}
<div class="section-title">
    <div>
        <p class="kicker">Inventaire</p>
        <h2>Ajouter un article</h2>
        <p class="muted">Quantité initiale et seuil d’alerte.</p>
    </div>
    <a class="btn-outline" href="{% url 'inventory:ingredients' %}">← Retour</a>
</div>

<div class="card">
    <form method="post" class="form">
        {% csrf_token %}
        <div class="grid grid-2">
            <label>Nom{{ form.name.errors|default:"" }}{{ form.name }}</label>
            <label>Catégorie{{ form.category.errors|default:"" }}{{ form.category }}</label>
        </div>
        <div class="grid grid-3">
            <label>Quantité initiale{{ form.quantity_in_stock.errors|default:"" }}{{ form.quantity_in_stock }}</label>
            <label>Unité{{ form.unit.errors|default:"" }}{{ form.unit }}</label>
            <label>Seuil d’alerte{{ form.alert_threshold.errors|default:"" }}{{ form.alert_threshold }}</label>
        </div>
        <div class="grid grid-3">
            <label>Coût unitaire{{ form.unit_cost.errors|default:"" }}{{ form.unit_cost }}</label>
            <label>Fournisseur{{ form.supplier.errors|default:"" }}{{ form.supplier }}</label>
            <label>Lieu de stockage{{ form.storage_location.errors|default:"" }}{{ form.storage_location }}</label>
        </div>
        <label>Date d’expiration{{ form.expiry_date.errors|default:"" }}{{ form.expiry_date }}</label>
        <label>Actif {{ form.is_active }}</label>
        <button class="btn" type="submit">Enregistrer</button>
    </form>
</div>
{% endblock %}
