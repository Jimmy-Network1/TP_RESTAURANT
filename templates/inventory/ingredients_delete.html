{% extends "base_staff.html" %}

{% block title %}Supprimer un ingrédient{% endblock %}

{% block content %}
<h1>Supprimer un ingrédient</h1>
<p>Confirmer la suppression de "{{ ingredient.name }}" ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'inventory:ingredients' %}">Annuler</a>
</form>
{% endblock %}
