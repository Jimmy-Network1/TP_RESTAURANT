{% extends "base_staff.html" %}

{% block title %}Nouveau mouvement — Inventaire{% endblock %}

{% block content %}
<div class="section-title">
    <div>
        <p class="kicker">Inventaire</p>
        <h2>Nouveau mouvement</h2>
        <p class="muted">Entrée, sortie, transfert ou ajustement.</p>
    </div>
    <a class="btn-outline" href="{% url 'inventory:movements' %}">← Retour</a>
</div>

<div class="card">
    <form method="post" class="form">
        {% csrf_token %}
        <label>Produit{{ form.ingredient.errors|default:"" }}{{ form.ingredient }}</label>
        <div class="grid grid-2">
            <label>Type{{ form.movement_type.errors|default:"" }}{{ form.movement_type }}</label>
            <label>Quantité{{ form.quantity.errors|default:"" }}{{ form.quantity }}</label>
        </div>
        <label>Note{{ form.note.errors|default:"" }}{{ form.note }}</label>
        <button class="btn" type="submit">Enregistrer</button>
    </form>
</div>
{% endblock %}
