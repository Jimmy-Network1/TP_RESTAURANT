{% extends "base_staff.html" %}

{% block title %}Supprimer un bon{% endblock %}

{% block content %}
<h1>Supprimer un bon de commande</h1>
<p>Confirmer la suppression du bon #{{ purchase_order.id }} ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'inventory:purchase_orders' %}">Annuler</a>
</form>
{% endblock %}
