{% extends "base_staff.html" %}
{% block title %}Nouveau mouvement — Saveur 237{% endblock %}
{% block content %}
<div data-animate="fadeUp" style="margin-bottom:18px;">
  <span class="pill" style="background:var(--green-light);color:var(--green);">📋 Inventaire</span>
  <h2 style="font-family:'Playfair Display',serif;margin:8px 0 4px;">Enregistrer un mouvement</h2>
  <p class="muted">Entrée, sortie ou ajustement de stock.</p>
</div>

<div class="card" style="max-width:560px;" data-animate="fadeUp">
  <form method="post">{% csrf_token %}
    <div style="display:grid;gap:14px;">
      <label style="display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:13px;font-weight:600;color:#555;">📦 Article</span>
        {{ form.ingredient }}
        {% if form.ingredient.errors %}<small style="color:var(--red);font-size:12px;">{{ form.ingredient.errors.0 }}</small>{% endif %}
      </label>

      <label style="display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:13px;font-weight:600;color:#555;">📊 Type de mouvement</span>
        {{ form.movement_type }}
        {% if form.movement_type.errors %}<small style="color:var(--red);font-size:12px;">{{ form.movement_type.errors.0 }}</small>{% endif %}
      </label>

      <label style="display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:13px;font-weight:600;color:#555;">🔢 Quantité</span>
        {{ form.quantity }}
        {% if form.quantity.errors %}<small style="color:var(--red);font-size:12px;">{{ form.quantity.errors.0 }}</small>{% endif %}
      </label>

      <label style="display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:13px;font-weight:600;color:#555;">📝 Note</span>
        <textarea name="note" rows="3" placeholder="Raison du mouvement…" style="padding:10px 12px;border:1px solid #ddd;border-radius:8px;resize:vertical;">{{ form.note.value|default:'' }}</textarea>
      </label>
    </div>

    <div style="margin-top:18px;display:flex;gap:10px;">
      <button class="btn" type="submit">💾 Enregistrer</button>
      <a class="btn-outline" href="{% url 'inventory:movements' %}">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
