{% extends "base_staff.html" %}
{% block title %}Encaisser — Saveur 237{% endblock %}
{% block content %}
<div class="section-title">
    <div>
        <p class="kicker">Caisse</p>
        <h2>Encaisser</h2>
        <p class="muted">Sélectionnez la commande puis validez le paiement.</p>
    </div>
    <a class="btn-outline" href="{% url 'sales:payments' %}">← Historique</a>
</div>

<div class="card">
    <form method="post" class="form">
        {% csrf_token %}
        <label>Commande{{ form.order.errors|default:"" }}{{ form.order }}</label>
        <div class="grid grid-2">
            <label>Montant{{ form.amount.errors|default:"" }}{{ form.amount }}</label>
            <label>Mode de paiement{{ form.method.errors|default:"" }}{{ form.method }}</label>
        </div>
        <div class="table-actions" style="margin-top:12px;">
            <button class="btn" type="submit">Valider paiement</button>
        </div>
    </form>
</div>
{% endblock %}
