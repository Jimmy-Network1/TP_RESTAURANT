{% extends "base_staff.html" %}

{% block title %}Modifier une commande{% endblock %}

{% block content %}
<h1>Modifier une commande</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <h3>Articles</h3>
    {{ formset.management_form }}
    {% for item_form in formset %}
        {{ item_form.as_p }}
    {% endfor %}
    <button type="submit">Enregistrer</button>
</form>
{% endblock %}
