{% extends "base_staff.html" %}
{% block title %}Transfert / Fusion de tables — Saveur 237{% endblock %}
{% block content %}
<div class="section-title">
    <div>
        <p class="kicker">Salle</p>
        <h2>Transférer ou fusionner</h2>
        <p class="muted">Déplacez les commandes entre tables en quelques clics.</p>
    </div>
    <a class="btn-outline" href="{% url 'sales:tables' %}">← Plan</a>
</div>

<div class="card">
    <form method="post" class="form">
        {% csrf_token %}
        <div class="grid grid-2">
            <label>Table source{{ form.source.errors|default:"" }}{{ form.source }}</label>
            <label>Table destination{{ form.destination.errors|default:"" }}{{ form.destination }}</label>
        </div>
        <label>Action{{ form.action.errors|default:"" }}{{ form.action }}</label>
        <div class="table-actions" style="margin-top:12px;">
            <button class="btn" type="submit">Confirmer</button>
            <a class="btn-outline" href="{% url 'sales:tables' %}">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
