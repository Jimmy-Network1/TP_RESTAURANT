{% extends "base_staff.html" %}

{% block title %}Supprimer une commande{% endblock %}

{% block content %}
<h1>Supprimer une commande</h1>
<p>Confirmer la suppression de la commande #{{ order.id }} ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'sales:orders' %}">Annuler</a>
</form>
{% endblock %}
