{% extends "base_staff.html" %}

{% block title %}Supprimer une commande{% endblock %}

{% block content %}
<div class="section-title">
    <div>
        <p class="kicker">POS</p>
        <h2>Supprimer commande #{{ order.id }}</h2>
        <p class="muted">Cette action est définitive.</p>
    </div>
    <a class="btn-outline" href="{% url 'sales:orders' %}">Annuler</a>
</div>
<div class="card">
    <p>Confirmer la suppression de la commande #{{ order.id }} ?</p>
    <form method="post" class="table-actions" style="margin-top:12px;">
        {% csrf_token %}
        <button class="btn" type="submit">Oui, supprimer</button>
        <a class="btn-outline" href="{% url 'sales:orders' %}">Non</a>
    </form>
</div>
{% endblock %}
