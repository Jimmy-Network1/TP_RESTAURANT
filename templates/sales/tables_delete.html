{% extends "base_staff.html" %}

{% block title %}Supprimer une table{% endblock %}

{% block content %}
<h1>Supprimer une table</h1>
<p>Confirmer la suppression de "{{ table.name }}" ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'sales:tables' %}">Annuler</a>
</form>
{% endblock %}
