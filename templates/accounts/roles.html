{% extends "base.html" %}

{% block title %}Rôles{% endblock %}

{% block content %}
<h1>Rôles</h1>
{% if profiles %}
<ul>
    {% for profile in profiles %}
    <li>{{ profile.user.username }} — {{ profile.get_role_display }}</li>
    {% endfor %}
</ul>
{% else %}
<p>Aucun utilisateur.</p>
{% endif %}
{% endblock %}
