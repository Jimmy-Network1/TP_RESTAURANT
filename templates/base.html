{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Restaurant Web{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="{% url 'home' %}">🍽️ Restaurant Web</a>
        </div>
        <ul class="navbar-links">
            <li><a href="{% url 'menu:categories' %}">Catégories</a></li>
            <li><a href="{% url 'menu:dishes' %}">Plats</a></li>
            <li><a href="{% url 'sales:tables' %}">Tables</a></li>
            <li><a href="{% url 'sales:orders' %}">Commandes</a></li>
            <li><a href="{% url 'kitchen:board' %}">Cuisine</a></li>
            <li><a href="{% url 'inventory:ingredients' %}">Stock</a></li>
            <li><a href="{% url 'reservations:list' %}">Réservations</a></li>
            <li><a href="{% url 'reports:dashboard' %}">Rapports</a></li>
            <li><a href="{% url 'accounts:roles' %}">Rôles</a></li>
            <li><a href="{% url 'accounts:login' %}">Connexion</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
