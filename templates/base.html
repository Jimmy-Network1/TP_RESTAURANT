{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Saveur 237{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "partials/_messages.html" %}
    {% include "partials/_nav_public.html" %}
    <main class="container" style="padding-top: 10px;">
        {% block content %}{% endblock %}
    </main>
    {% include "partials/_footer.html" %}
    <div class="toast" aria-live="polite" data-toast></div>
    <script src="{% static 'js/public.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
