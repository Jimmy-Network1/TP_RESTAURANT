{% extends "base_staff.html" %}

{% block title %}Supprimer une réservation{% endblock %}

{% block content %}
<h1>Supprimer une réservation</h1>
<p>Confirmer la suppression de la réservation de "{{ reservation.customer_name }}" ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'reservations:list' %}">Annuler</a>
</form>
{% endblock %}
