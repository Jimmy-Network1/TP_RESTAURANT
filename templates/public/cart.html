{% extends "base_public.html" %}
{% block title %}Panier — Saveur 237{% endblock %}
{% block content %}
<div class="section-title">
  <div>
    <h2>Panier</h2>
    <p class="muted">Ajustez vos quantites avant de commander.</p>
  </div>
  <a class="btn-outline" href="{% url 'public:menu' %}">Continuer les achats</a>
</div>

<div class="grid" style="grid-template-columns:2fr 1fr;gap:12px;">
  <div id="cart-items" class="cart-list"></div>
  <div class="card">
    <h3 style="margin-top:0;">Resume</h3>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span>Total</span>
      <strong><span id="cart-total">0</span> FCFA</strong>
    </div>
    <a class="btn" href="{% url 'public:checkout' %}" style="width:100%;margin-top:12px;">Passer commande</a>
  </div>
</div>
{% endblock %}
