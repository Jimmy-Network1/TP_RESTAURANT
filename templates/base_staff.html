{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Saveur 237 — Staff{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="staff-shell">
        {% include "partials/_sidebar_staff.html" %}
        <div class="staff-main">
            {% include "partials/_nav_staff.html" %}
            {% include "partials/_messages.html" %}
            {% block content %}{% endblock %}
        </div>
    </div>
    <script src="{% static 'js/staff.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
