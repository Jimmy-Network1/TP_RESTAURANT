{% extends "base_staff.html" %}
{% block title %}Tables — Saveur 237{% endblock %}
{% block content %}
<div class="section-title">
    <h2>Tables</h2>
</div>
<table class="table">
    <thead><tr><th>Table</th><th>Statut</th><th>Serveur</th></tr></thead>
    <tbody>
    {% for table in tables %}
        <tr>
            <td>{{ table.name }}</td>
            <td><span class="status-pill status-{{ table.status }}">{{ table.status }}</span></td>
            <td>{{ table.server|default:"-" }}</td>
        </tr>
    {% empty %}
        <tr><td colspan="3" class="empty">Aucune table.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
