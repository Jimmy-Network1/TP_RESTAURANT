{% extends "base_staff.html" %}
{% block title %}Plat — Saveur 237{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;">
    <h2>{% if dish %}Modifier{% else %}Nouveau{% endif %} plat</h2>
    <form class="form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Nom<input name="name" value="{{ dish.name|default:'' }}" required></label>
        <label>Catégorie
            <select name="category_id">
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if dish.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Prix<input type="number" step="0.01" name="price" value="{{ dish.price|default:'' }}" required></label>
        <label>Description<textarea name="description">{{ dish.description }}</textarea></label>
        <label>Photo<input type="file" name="photo"></label>
        <label><input type="checkbox" name="available" {% if dish.available %}checked{% endif %}> Disponible</label>
        <button class="btn">Enregistrer</button>
    </form>
</div>
{% endblock %}
